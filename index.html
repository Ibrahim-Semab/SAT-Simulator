<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital SAT Practice</title>
<style>
:root{
  /* ── palette: change these to re-theme everything ── */
  --ink:#0f1722; --ink2:#556270; --line:#cdd5dd; --bg:#fff; --bar:#eef1f4;
  --accent:#0b7a6e; --accent-d:#085e55; --accent-s:#e3f4f1;
  --flag:#c2410c; --good:#1b7f4c; --good-s:#e4f5ec; --bad:#b42318; --bad-s:#fdeceb;
  --r1:#0b7a6e; --r2:#e4572e; --r3:#f2b134;       /* ribbon colours */
  --s:1; /* image scale, set by script */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}

/* ribbon (the dashed stripe under the header / above the footer) */
.ribbon{height:5px;flex:none;background:repeating-linear-gradient(90deg,var(--r1) 0 26px,transparent 26px 34px,var(--r2) 34px 60px,transparent 60px 68px,var(--r3) 68px 94px,transparent 94px 102px)}

/* header */
.hdr{flex:none;height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;background:var(--bg)}
.hl{min-width:0}
.ttl{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirbtn{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);margin-top:2px;padding:2px 0}
.dirbtn:hover{color:var(--ink)}
.hc{display:flex;flex-direction:column;align-items:center;gap:3px}
.tm{font-weight:700;font-size:22px;letter-spacing:.5px;font-variant-numeric:tabular-nums;line-height:1;min-height:22px;display:flex;align-items:center}
.tm.warn{color:var(--bad)}
.pill{border:1.5px solid var(--ink);border-radius:20px;font-size:12px;font-weight:600;padding:2px 14px;line-height:18px}
.pill:hover{background:var(--bar)}
.hr{display:flex;justify-content:flex-end;gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink);padding:5px 10px;border-radius:8px;min-width:58px}
.tool:hover{background:var(--bar)}
.tool.on{background:var(--accent-s);color:var(--accent-d)}
.tool svg{width:22px;height:22px}

/* panes */
.main{flex:1;min-height:0;display:flex;background:var(--bg)}
.main.side .pane{overflow:auto}
.main.stack{flex-direction:column;overflow:auto}
.pane.left{flex:0 0 50%;min-width:0}
.main.stack .pane.left{flex:none}
.pane.right{flex:1;min-width:0;display:flex;flex-direction:column}
.main.stack .pane.right{flex:none}
.divider{flex:none;width:12px;cursor:col-resize;position:relative;background:var(--bg)}
.divider::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
.divider::after{content:"";position:absolute;left:1px;top:50%;width:10px;height:36px;margin-top:-18px;border-radius:5px;background:var(--bg);border:2px solid var(--line)}
.main.stack .divider{display:none}
.main.stack .pane.left{border-bottom:2px solid var(--line)}
.pad{padding:26px 28px 40px}
.crop{background-repeat:no-repeat;max-width:none}
.stem{position:relative;display:block;user-select:none}
.stem.hl-on{cursor:crosshair}
.hlbox{position:absolute;background:#ffd84d;mix-blend-mode:multiply;opacity:.75;border-radius:2px}
.hl-on .hlbox{cursor:pointer}
.hl-on .hlbox:hover{outline:2px solid var(--flag)}
.hlnew{position:absolute;background:#ffd84d;opacity:.5;pointer-events:none}

/* question bar */
.qbar{flex:none;display:flex;align-items:center;gap:14px;background:var(--bar);padding:8px 16px 8px 20px;border-bottom:2px solid var(--ink)}
.qn{width:30px;height:30px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center;border-radius:2px}
.mark{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:4px 6px;border-radius:6px}
.mark:hover{background:#e0e5ea}
.mark svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.8}
.mark.on svg{fill:var(--flag);stroke:var(--flag)}
.mark.on{color:var(--flag)}
.abc{margin-left:auto;font-size:12.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:2px 9px;position:relative;line-height:20px;letter-spacing:.5px}
.abc::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:1.5px;background:var(--ink)}
.abc.on{background:var(--ink);color:#fff}.abc.on::after{background:#fff}
.right-scroll{flex:1;min-height:0;overflow:auto}
.main.side .pane.right{overflow:hidden}

/* choices */
.prompt{margin-bottom:22px}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--ink);border-radius:10px;padding:10px 14px;background:var(--bg);position:relative;transition:border-color .1s,background .1s}
.choice:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.letter{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.choice.sel{border-color:var(--accent);background:var(--accent-s);box-shadow:0 0 0 1px var(--accent)}
.choice.sel .letter{background:var(--accent);border-color:var(--accent);color:#fff}
.choice .ct{position:relative;flex:none;mix-blend-mode:multiply}
.choice.out{border-style:dashed;border-color:#8b96a3;box-shadow:none}
.choice.out .ct{opacity:.38}
.choice.out .ct::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--ink)}
.choice.out .letter{opacity:.45}
.xb{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:none;place-items:center;font-size:12px;font-weight:700;position:relative;background:var(--bg)}
.xb::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1.5px;background:var(--ink)}
.elim .xb{display:grid}
.choice.out .xb{background:var(--ink);color:#fff}.choice.out .xb::after{background:#fff}
.choice.fb-good{border-color:var(--good);background:var(--good-s);box-shadow:0 0 0 1px var(--good)}
.choice.fb-good .letter{background:var(--good);border-color:var(--good);color:#fff}
.choice.fb-bad{border-color:var(--bad);background:var(--bad-s);box-shadow:0 0 0 1px var(--bad)}
.choice.fb-bad .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.choice.static{cursor:default}.choice.static:hover{box-shadow:none;border-color:var(--ink)}
.choice.static.fb-good:hover{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.choice.static.fb-bad:hover{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.plain-choice .ct{display:none}
.tag{margin-left:auto;font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px;background:var(--ink);color:#fff}

/* student-produced response */
.spr label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.spr input{width:240px;font-size:22px;font-weight:600;padding:10px 14px;border:1.5px solid var(--ink);border-radius:8px;letter-spacing:1px;background:var(--bg);color:var(--ink)}
.spr input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent)}
.sprprev{margin-top:20px;font-size:13px;color:var(--ink2)}
.sprprev .box{margin-top:6px;min-height:52px;width:240px;border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;font-size:22px;font-weight:600;color:var(--ink);display:flex;align-items:center;background:var(--bar)}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;line-height:1.15;margin:0 2px;vertical-align:middle}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1.5px solid var(--ink)}

/* footer */
.ftr{flex:none;height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;background:var(--bg)}
.who{font-weight:700;font-size:15px}
.navpill{background:var(--ink);color:#fff;border-radius:8px;padding:9px 18px;font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.navpill:hover{background:#000}
.navpill svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4}
.fr-r{display:flex;justify-content:flex-end;gap:10px}
.btn{background:var(--accent);color:#fff;border-radius:22px;padding:10px 30px;font-weight:700;font-size:15px;min-width:92px;transition:background .1s}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:none;color:var(--accent-d);border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--accent-s)}
.btn.big{padding:14px 44px;font-size:17px}

/* overlays */
.pop{position:fixed;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(15,23,34,.22)}
.navpop{left:50%;transform:translateX(-50%);bottom:78px;width:min(620px,calc(100vw - 24px));padding:20px 22px 18px}
.navpop h3,.chk h3{margin:0;font-size:16px}
.x{position:absolute;right:12px;top:10px;width:30px;height:30px;border-radius:50%;font-size:20px;line-height:28px;text-align:center}
.x:hover{background:var(--bar)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .k{width:16px;height:16px;border-radius:3px;display:inline-block}
.grid{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 14px;justify-content:flex-start}
.cell{position:relative;width:40px;height:40px;border-radius:4px;border:1.5px dashed var(--ink);font-weight:700;font-size:15px;display:grid;place-items:center;background:var(--bg);color:var(--accent-d)}
.cell.ans{background:var(--accent);border:1.5px solid var(--accent);color:#fff}
.cell.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.cell .pin{position:absolute;top:-17px;left:50%;margin-left:-6px;width:12px;height:14px;fill:var(--ink)}
.cell .fl{position:absolute;top:-7px;right:-7px;width:16px;height:16px;fill:var(--flag);stroke:#fff;stroke-width:1.5}
.lg-dash{border:1.5px dashed var(--ink);background:var(--bg)}
.lg-ans{background:var(--accent)}
.centerbtn{display:flex;justify-content:center;margin-top:6px}
.dirpop{left:24px;top:64px;width:min(680px,calc(100vw - 48px));max-height:calc(100vh - 150px);overflow:auto;padding:22px 26px 20px;font-size:14.5px;line-height:1.55}
.dirpop h3{margin:0 0 8px;font-size:16px}.dirpop ul{margin:6px 0 10px;padding-left:20px}.dirpop p{margin:6px 0}
.morepop{right:24px;top:64px;width:250px;padding:8px}
.morepop button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600}
.morepop button:hover{background:var(--bar)}
.morepop .sub{font-size:11px;font-weight:700;color:var(--ink2);padding:8px 12px 2px;text-transform:uppercase;letter-spacing:.6px}
.morepop .opt.on{color:var(--accent-d);background:var(--accent-s)}
.float{width:340px;top:90px;right:40px}
.float .tb{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;font-weight:700;font-size:14px;cursor:move;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;background:var(--bar);user-select:none;touch-action:none}
.float .tb .x{position:static}
.calc{padding:12px}
.cdisp{width:100%;font-size:24px;text-align:right;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;font-family:inherit;background:var(--bg);color:var(--ink)}
.cres{min-height:24px;text-align:right;font-size:14px;color:var(--ink2);padding:4px 4px 8px}
.ckeys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ckeys button{padding:11px 0;border-radius:8px;background:var(--bar);font-weight:600;font-size:15px}
.ckeys button:hover{background:#dfe5ea}
.ckeys button.op{background:#dbe9e7}
.ckeys button.eq{background:var(--accent);color:#fff}
.ref{width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.ref .rb{overflow:auto;padding:16px 18px 18px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.rgrid>div{text-align:center;font-size:12.5px;line-height:1.5}
.rgrid svg{margin:0 auto 4px;width:100%;max-width:140px;height:84px;stroke:var(--ink);fill:none;stroke-width:1.6}
.rgrid svg text{fill:var(--ink);stroke:none;font-size:11px;font-family:inherit}
.rfacts{margin:14px 0 0;padding-left:18px;font-size:13px;line-height:1.6}
.notes{width:320px}
.notes textarea{display:block;width:calc(100% - 24px);margin:12px;height:150px;resize:vertical;padding:10px;border:1.5px solid var(--ink);border-radius:8px;font:inherit;font-size:14px}
.notes .hint{margin:0 12px 12px;font-size:12px;color:var(--ink2)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,34,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;padding:26px 28px 22px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;font-size:19px}.modal p{margin:0 0 20px;color:var(--ink2);font-size:14.5px;line-height:1.5}
.modal .acts{display:flex;justify-content:flex-end;gap:10px}

/* centered screens */
.center{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:36px 20px 50px}
.chk{width:min(760px,100%);margin:auto 0}
.chk h1{font-size:30px;margin:0 0 6px;text-align:center}
.chk .lead{text-align:center;color:var(--ink2);font-size:15px;margin:0 0 26px}
.chk .card{border:1px solid var(--line);border-radius:14px;padding:22px 26px 12px;position:relative}
.chk .card .grid{margin-top:26px}
.chk .cell{width:46px;height:46px;font-size:16px}
.mid{margin:auto;text-align:center;max-width:520px}
.mid h1{font-size:30px;margin:0 0 10px}
.mid p{color:var(--ink2);font-size:16px;line-height:1.55;margin:0 0 26px}
.bigclock{font-size:68px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 26px}

/* home */
.home{width:min(620px,100%);margin:auto;padding-top:10px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.5px}
.home h1{font-size:30px;margin:0;line-height:1.1}
.home .sub{color:var(--ink2);font-size:14px;margin-top:3px}
.startrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cover{height:6px;background:var(--bar);border-radius:3px;overflow:hidden;margin:22px 0 6px}
.cover i{display:block;height:100%;background:var(--accent)}
.covt{font-size:12.5px;color:var(--ink2)}
.hist{margin-top:30px;border-top:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:14px}
.hrow b{font-size:15px}.hrow .meta{color:var(--ink2);font-size:13px}
.hrow .sc{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.hrow .sc b{font-size:20px;display:block;line-height:1.1}
.link{color:var(--accent-d);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.tiny{margin-top:34px;text-align:center;font-size:12px;color:var(--ink2)}
.resume{background:var(--accent-s);border:1px solid var(--accent);border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;font-size:14px}
.resume b{display:block;font-size:15px}.resume .btn{margin-left:auto;padding:8px 22px}

/* results */
.res{width:min(860px,100%);margin:0 auto}
.res h1{font-size:28px;margin:0 0 4px}
.scores{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;margin:20px 0 10px}
.sbox{border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.sbox.tot{background:var(--ink);color:#fff;border-color:var(--ink)}
.sbox .l{font-size:13px;opacity:.8;font-weight:600}
.sbox .v{font-size:40px;font-weight:800;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sbox .d{font-size:13px;opacity:.8}
.note{font-size:12.5px;color:var(--ink2);margin:0 0 26px}
.mrow{margin:0 0 22px}
.mrow h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.mrow h3 span{color:var(--ink2);font-weight:600}
.mrow .grid{margin:10px 0 0}
.cell.rg{background:var(--good);border-color:var(--good);color:#fff}
.cell.rb2{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.ru{border-style:dashed;color:var(--ink2)}
.resacts{display:flex;gap:12px;margin:10px 0 0;flex-wrap:wrap}
.rv{width:min(1100px,100%);margin:0 auto}
.rv .info{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;font-size:13.5px;color:var(--ink2)}
.rv .chip{border:1px solid var(--line);border-radius:14px;padding:2px 12px;font-weight:600}
.rv .chip.g{background:var(--good-s);border-color:var(--good);color:var(--good)}
.rv .chip.b{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.rv .qa{border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.rv img.rat{max-width:100%;height:auto;display:block;margin-top:6px}
.rv h4{margin:18px 0 4px;font-size:14px}
.yours{margin-top:14px;font-size:15px}

@media (max-width:760px){
  .hdr{padding:0 12px;height:auto;min-height:60px;grid-template-columns:1fr auto;row-gap:2px;padding-top:6px;padding-bottom:6px}
  .hc{grid-row:1;grid-column:2}.hr{grid-column:1/3;grid-row:2;justify-content:flex-start}
  .ttl{font-size:14px}.pad{padding:18px 14px 30px}.ftr{padding:0 12px}
  .tool{min-width:48px;padding:3px 6px}.scores{grid-template-columns:1fr}
  .btn{padding:9px 20px}.who{display:none}.ftr{grid-template-columns:auto 1fr}.ftr>div:first-child{display:none}
}
@media print{.ribbon,.hdr,.ftr{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<script src="bank/meta.js"></script>
<script>
"use strict";
/* ═════════════ constants ═════════════ */
const ORDER=['rw1','rw2','m1','m2'];
const MODS={
  rw1:{sec:1,num:1,s:'rw',name:'Reading and Writing',min:32},
  rw2:{sec:1,num:2,s:'rw',name:'Reading and Writing',min:32},
  m1:{sec:2,num:1,s:'math',name:'Math',min:35},
  m2:{sec:2,num:2,s:'math',name:'Math',min:35}
};
const DOMS={
  rw:['Craft and Structure','Information and Ideas','Standard English Conventions','Expression of Ideas'],
  math:['Algebra','Advanced Math','Problem-Solving and Data Analysis','Geometry and Trigonometry']
};
const QUOTA={rw1:[7,7,7,6],rw2:[7,7,7,6],m1:[8,7,4,3],m2:[7,8,3,4]};
const DIFF={rw1:{E:9,M:9,H:9},rw2h:{E:2,M:8,H:17},rw2l:{E:15,M:9,H:3},
            m1:{E:7,M:8,H:7},m2h:{E:3,M:7,H:12},m2l:{E:12,M:7,H:3}};
const THRESH={rw:16,math:13};      // module-1 correct answers needed for the harder module 2
const BREAK_SECONDS=600;
const BANK=window.BANK||[];
const BYID={};BANK.forEach(q=>BYID[q.id]=q);

/* ═════════════ helpers ═════════════ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const has=v=>String(v??'').trim()!=='';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v==null?null:JSON.parse(v)}catch(e){return mem[k]??null}},

/* ═════════════ test generation (history aware) ═════════════
   Every question gets a rank: how many times the student has already seen it dominates,
   then domain match, then difficulty match, then a little randomness. So unseen questions
   are always used first and, once everything is seen, the least-repeated ones come back. */
const seenN=id=>H.seen[id]||0;
function genModule(subject,quota,diff,used){
  const labels=[];['E','M','H'].forEach(k=>{for(let i=0;i<(diff[k]||0);i++)labels.push(k)});
  shuffle(labels);
  const slots=[];DOMS[subject].forEach((d,di)=>{for(let i=0;i<quota[di];i++)slots.push(d)});
  const pool=BANK.filter(q=>q.s===subject&&!used.has(q.id));
  const chosen=new Set(),out=[];
  slots.forEach((dom,i)=>{
    const want='EMH'.indexOf(labels[i%labels.length]);
    let best=null,bs=1e9;
    for(const q of pool){
      if(chosen.has(q.id))continue;
      const sc=seenN(q.id)*100+(q.d===dom?0:40)+Math.abs('EMH'.indexOf(q.l)-want)*12+Math.random()*6;
      if(sc<bs){bs=sc;best=q}
    }
    if(best){chosen.add(best.id);out.push(best)}
  });
  out.sort((a,b)=>DOMS[subject].indexOf(a.d)-DOMS[subject].indexOf(b.d)||('EMH'.indexOf(a.l)-'EMH'.indexOf(b.l))+(Math.random()-.5)*1.4);
  return out.map(q=>q.id);
}
const usedIds=()=>new Set(ORDER.flatMap(k=>T.plan[k]||[]));
function planModule(key){
  const m=MODS[key];
  let diff,quota=QUOTA[key];
  if(key==='rw1')diff=DIFF.rw1;
  else if(key==='m1')diff=DIFF.m1;
  else if(key==='rw2')diff=T.route.rw==='h'?DIFF.rw2h:DIFF.rw2l;
  else diff=T.route.math==='h'?DIFF.m2h:DIFF.m2l;
  T.plan[key]=genModule(m.s,quota,diff,usedIds());
}
function newTest(){
  H.n=(H.n||0)+1;saveH();
  T={id:Date.now().toString(36),n:H.n,started:Date.now(),plan:{rw1:null,rw2:null,m1:null,m2:null},route:{rw:null,math:null},
     ans:{},mark:{},el:{},hl:{},notes:{},phase:'exam',mod:'rw1',idx:0,left:0,breakLeft:BREAK_SECONDS,done:{}};
  planModule('rw1');
  loadModule('rw1');
}

/* ═════════════ scoring ═════════════ */
function normText(v){return String(v??'').trim().toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/,/g,'')}
function numVal(s){
  const x=String(s??'').trim().replace(/[−–—]/g,'-').replace(/,/g,'').replace(/\s+/g,'');
  if(!x)return null;
  const f=x.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))\/([+-]?(?:\d+(?:\.\d*)?|\.\d+))$/);
  if(f){const a=+f[1],b=+f[2];return b===0?null:a/b}
  if(/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(x)){const n=Number(x);return isFinite(n)?n:null}
  return null;
}
function aliases(key){let s=String(key??'').trim();s=s.replace(/(?<=\d),(?=\d{3}(?:\D|$))/g,'');return s.split(/\s*,\s*/).filter(Boolean)}
function isCorrect(q,v){
  if(!has(v))return false;
  if(q.m==='MCQ')return String(v).trim().toUpperCase()===String(q.a).trim().toUpperCase();
  if(normText(v)===normText(q.a))return true;
  const opts=aliases(q.a),vn=normText(v);
  if(opts.some(a=>normText(a)===vn))return true;
  const n=numVal(v);if(n===null)return false;
  return opts.some(a=>{const an=numVal(a);return an!==null&&Math.abs(n-an)<=Math.max(5e-5,Math.abs(an)*5e-5)});
}
const modCorrect=k=>(T.plan[k]||[]).reduce((n,id)=>n+(isCorrect(BYID[id],T.ans[id])?1:0),0);
function estScaled(items,route){            // rough estimate only, not an official conversion
  if(!items.length)return 200;
  const w={E:1,M:2,H:3};let g=0,t=0;
  items.forEach(x=>{t+=w[x.q.l];if(x.ok)g+=w[x.q.l]});
  const cap=route==='l'?.78:1;
  return clamp(Math.round((200+600*(g/t)*cap)/10)*10,200,800);
}
function summarize(t){
  const S={};
  ['rw','math'].forEach(s=>{
    const keys=ORDER.filter(k=>MODS[k].s===s&&t.plan[k]);
    const items=keys.flatMap(k=>t.plan[k].map(id=>({q:BYID[id],ok:isCorrect(BYID[id],t.ans[id])})));
    const route=s==='rw'?t.route.rw:t.route.math;
    S[s]={correct:items.filter(x=>x.ok).length,total:items.length,est:estScaled(items,route),route};
  });
  S.total=S.rw.est+S.math.est;
  return S;
}

/* ═════════════ timers ═════════════ */
let deadline=0,tickH=null;
function startClock(){clearInterval(tickH);tickH=setInterval(tick,250);tick()}
function tick(){
  if(!T)return;
  const now=Date.now();
  if(T.phase==='break'){
    T.breakLeft=Math.max(0,Math.ceil((deadline-now)/1000));
    const b=$('#bigclock');if(b)b.textContent=mmss(T.breakLeft);
    if(T.breakLeft<=0)endBreak();
    return;
  }
  if(T.phase==='exam'||T.phase==='review'){
    T.left=Math.max(0,Math.ceil((deadline-now)/1000));
    drawTimer();
    if(T.left<=0)submitModule(true);
  }
}
function drawTimer(){
  const t=$('#tm');if(!t)return;
  t.innerHTML=UI.timer?mmss(T.left):ICON.clock;
  t.classList.toggle('warn',UI.timer&&T.left<=60);
  const h=$('#hidebtn');if(h)h.textContent=UI.timer?'Hide':'Show';
}

/* ═════════════ flow ═════════════ */
function loadModule(key){
  if(!T.plan[key])planModule(key);
  T.mod=key;T.idx=0;T.phase='exam';
  T.left=MODS[key].min*60;
  (T.plan[key]||[]).forEach(id=>{H.seen[id]=(H.seen[id]||0)+1});saveH();
  deadline=Date.now()+T.left*1000;
  closeAll();save();draw();startClock();
}
function resumeClock(){deadline=Date.now()+(T.phase==='break'?T.breakLeft:T.left)*1000;startClock()}
function submitModule(auto){
  closeAll();
  const k=T.mod;T.done[k]=true;
  if(k==='rw1'){T.route.rw=modCorrect('rw1')>=THRESH.rw?'h':'l';planModule('rw2');T.next='rw2';T.phase='between'}
  else if(k==='rw2'){T.next='m1';T.phase='break';T.breakLeft=BREAK_SECONDS;deadline=Date.now()+BREAK_SECONDS*1000}
  else if(k==='m1'){T.route.math=modCorrect('m1')>=THRESH.math?'h':'l';planModule('m2');T.next='m2';T.phase='between'}
  else{finishTest();return}
  save();draw();
}
function endBreak(){loadModule('m1')}
function finishTest(){
  clearInterval(tickH);
  T.phase='results';T.finished=Date.now();
  T.sum=summarize(T);
  H.tests=H.tests.filter(x=>x.id!==T.id);H.tests.unshift(JSON.parse(JSON.stringify(T)));saveH();
  const done=T;clearCur();T=done;UI.view=null;draw();
}

/* ═════════════ image rendering ═════════════ */
const cropEl=(q,x0,y0,y1,cls='',x1)=>
 `<div class="crop ${cls}" style="width:calc(var(--s)*${(x1||q.w)-x0}px);height:calc(var(--s)*${y1-y0}px);background-image:url(bank/q/${q.id}.webp);background-size:calc(var(--s)*${q.w}px) auto;background-position:calc(var(--s)*${-x0}px) calc(var(--s)*${-y0}px)"></div>`;
function stemHTML(q,withHl){
  const r=q.split?q.stem:[0,q.h];
  const boxes=withHl?(T.hl[q.id]||[]).map((b,i)=>`<div class="hlbox" data-i="${i}" style="left:calc(var(--s)*${b[0]}px);top:calc(var(--s)*${b[1]}px);width:calc(var(--s)*${b[2]}px);height:calc(var(--s)*${b[3]}px)"></div>`).join(''):'';
  return `<div class="stem ${UI.hlMode&&withHl?'hl-on':''}" id="stem" data-y0="${r[0]}" style="width:calc(var(--s)*${q.w}px);height:calc(var(--s)*${r[1]-r[0]}px)">${cropEl(q,0,r[0],r[1])}${boxes}</div>`;
}
const promptHTML=q=>q.split&&q.prompt?`<div class="prompt">${cropEl(q,0,q.prompt[0],q.prompt[1])}</div>`:'';
function choiceHTML(q,L,i,cls,attrs,extra=''){
  const body=q.split&&q.choices?cropEl(q,q.choices[i][2],q.choices[i][0],q.choices[i][1],'ct',q.choices[i][3]):'';
  return `<button class="choice ${cls}${body?'':' plain-choice'}" ${attrs}><span class="letter">${L}</span>${body}${extra}</button>`;
}

function draw(){
  closePops();

  if(!T){UI.view=null;drawHome(app);return}

  if(T.phase==='exam')drawExam(app);
  else if(T.phase==='review')drawReview(app);
  else if(T.phase==='between')drawBetween(app);
  else if(T.phase==='break')drawBreak(app);
  else if(T.phase==='results')drawResults(app);
  layout();
}

function fracHTML(v){
  v=String(v||'').replace(/-/g,'−');
  const m=v.match(/^(−?\d*\.?\d*)\/(\d*\.?\d*)$/);
  return m&&m[1]!==''&&m[2]!==''?`<span class="fr"><i>${esc(m[1])}</i><i>${esc(m[2])}</i></span>`:esc(v);
}

function drawHome(app){
  const seen=BANK.filter(q=>H.seen[q.id]).length;
  const cur=store.get('sat.cur.v1');
  const rows=H.tests.map(t=>{
    const S=t.sum;if(!S)return '';
    const d=new Date(t.finished||t.started);
    return `<div class="hrow"><div><b>Practice Test ${t.n}</b><div class="meta">${d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} · RW ${S.rw.est} · Math ${S.math.est}</div></div>
    <div class="sc"><b>${S.total}</b><button class="link" data-a="open" data-id="${t.id}">Review</button></div></div>`}).join('');
  app.innerHTML=`<div class="ribbon"></div><div class="center"><div class="home"><div class="brand"><div class="logo">SAT</div><div><h1>Digital SAT Practice</h1><div class="sub">Full-length adaptive tests</div></div></div>
  ${cur?`<div class="resume"><div><b>Practice Test ${cur.n} in progress</b>${MODS[cur.mod].name} · Module ${MODS[cur.mod].num}</div><button class="btn" data-a="resumetest">Resume</button></div>`:''}
  <div class="startrow"><button class="btn big" data-a="start">Start Practice Test ${(H.n||0)+(cur?1:1)}</button></div>
  <div class="cover"><i style="width:${BANK.length?Math.round(100*seen/BANK.length):0}%"></i></div><div class="covt">${seen} of ${BANK.length} questions seen</div>
  ${rows?`<div class="hist">${rows}</div>`:''}
  <div class="tiny">${H.tests.length?'<button class="link" data-a="reset">Reset history</button>':''}</div></div></div><div class="ribbon"></div>`;
}

/* ═════════════ layout / scale ═════════════ */
function layout(){
  const main=$('#main'),pl=$('#pl'),pr=$('#pr');
  const mode=UI.layout==='auto'?(innerWidth>=1700?'side':'stack'):UI.layout;
  let s;
  if(main){
    main.classList.toggle('side',mode==='side');main.classList.toggle('stack',mode!=='side');
    if(mode==='side'){
      if(UI.split)pl.style.flexBasis=UI.split+'px';else pl.style.flexBasis='50%';
      const lw=pl.getBoundingClientRect().width,rw=main.getBoundingClientRect().width-lw-12;
      s=Math.min((lw-56)/853,(rw-126)/832);
    }else{pl.style.flexBasis='';s=Math.min((main.clientWidth-126)/832,1.2)}
  }else{
    const w=Math.min(innerWidth,1100);s=(w-200)/832;
  }
  document.documentElement.style.setProperty('--s',clamp(s,.55,1.3).toFixed(3));
}
addEventListener('resize',()=>{layout()});
function bindDivider(){
  const dv=$('#dv');if(!dv)return;
  dv.addEventListener('pointerdown',e=>{
    e.preventDefault();dv.setPointerCapture(e.pointerId);
    const mv=ev=>{const m=$('#main').getBoundingClientRect();UI.split=clamp(ev.clientX-m.left,m.width*.3,m.width*.7);layout()};
    const up=()=>{dv.removeEventListener('pointermove',mv);dv.removeEventListener('pointerup',up)};
    dv.addEventListener('pointermove',mv);dv.addEventListener('pointerup',up);
  });
}

/* ═════════════ highlighter (drag a box over the passage) ═════════════ */
function redrawStem(){const q=BYID[T.plan[T.mod][T.idx]];$('#stem').outerHTML=stemHTML(q,true);bindStem()}
function bindStem(){
  const st=$('#stem');if(!st||MODS[T.mod].s!=='rw')return;
  const id=T.plan[T.mod][T.idx];
  let start=null,tmp=null;
  const sc=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||1;
  st.addEventListener('click',e=>{
    if(!UI.hlMode)return;
    const b=e.target.closest('.hlbox');
    if(b){T.hl[id].splice(+b.dataset.i,1);save();redrawStem()}
  });
  st.addEventListener('pointerdown',e=>{
    if(!UI.hlMode||e.target.closest('.hlbox'))return;
    const r=st.getBoundingClientRect();start={x:e.clientX-r.left,y:e.clientY-r.top};
    tmp=document.createElement('div');tmp.className='hlnew';st.appendChild(tmp);st.setPointerCapture(e.pointerId);
  });
  st.addEventListener('pointermove',e=>{
    if(!start)return;
    const r=st.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    Object.assign(tmp.style,{left:Math.min(start.x,x)+'px',top:Math.min(start.y,y)+'px',width:Math.abs(x-start.x)+'px',height:Math.abs(y-start.y)+'px'});
  });
  st.addEventListener('pointerup',e=>{
    if(!start)return;
    const r=st.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,s=sc();
    const w=Math.abs(x-start.x),h=Math.abs(y-start.y);
    const box=[Math.min(start.x,x)/s,Math.min(start.y,y)/s,w/s,h/s];
    tmp.remove();tmp=null;start=null;
    if(w>6&&h>4){(T.hl[id]=T.hl[id]||[]).push(box.map(v=>Math.round(v)));save();redrawStem()}
  });
}

function floatWin(id,title,inner,cls,pos){
  const old=document.getElementById(id);if(old){old.remove();return}
  const d=document.createElement('div');d.id=id;d.className='pop float '+cls;
  if(pos)Object.assign(d.style,pos);
  d.innerHTML=`<div class="tb"><span>${title}</span><button class="x" data-a="closefloat" data-id="${id}" aria-label="Close">×</button></div>${inner}`;
  $('#ov').appendChild(d);
  const tb=d.querySelector('.tb');
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('.x'))return;
    const r=d.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
    tb.setPointerCapture(e.pointerId);
    const mv=ev=>{d.style.left=clamp(ev.clientX-ox,0,innerWidth-80)+'px';d.style.top=clamp(ev.clientY-oy,0,innerHeight-60)+'px';d.style.right='auto'};
    const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up)};
    tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up);
  });
  return d;
}
/* calculator */
let calcAns=0,deg=false;
function calcEval(src){
  const s=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,' pi ').replace(/√/g,' sqrt ');
  const raw=s.match(/\d+\.?\d*|\.\d+|[a-z]+|[()+*/^\-]/gi)||[];
  const tk=[];
  raw.forEach(t=>{
    const pv=tk[tk.length-1];
    const isV=x=>x!==undefined&&(/^[\d.]/.test(x)||x===')'||x==='pi'||x==='ans');
    const startsVal=/^[\d.]/.test(t)||t==='('||/^[a-z]/i.test(t);
    if(isV(pv)&&startsVal&&!(/^[\d.]/.test(pv)&&/^[\d.]/.test(t)))tk.push('*');
    tk.push(t.toLowerCase());
  });
  let p=0;
  const F={sin:x=>Math.sin(deg?x*Math.PI/180:x),cos:x=>Math.cos(deg?x*Math.PI/180:x),tan:x=>Math.tan(deg?x*Math.PI/180:x),ln:Math.log,log:Math.log10,sqrt:Math.sqrt,abs:Math.abs};
  const expr=()=>{let v=term();while(tk[p]==='+'||tk[p]==='-'){const o=tk[p++],r=term();v=o==='+'?v+r:v-r}return v};
  const term=()=>{let v=pow();while(tk[p]==='*'||tk[p]==='/'){const o=tk[p++],r=pow();v=o==='*'?v*r:v/r}return v};
  const pow=()=>{let v=un();if(tk[p]==='^'){p++;v=Math.pow(v,pow())}return v};
  const un=()=>{if(tk[p]==='-'){p++;return -un()}if(tk[p]==='+'){p++;return un()}return prim()};
  const prim=()=>{
    const t=tk[p++];
    if(t==='('){const v=expr();if(tk[p]===')')p++;return v}
    if(t==='pi')return Math.PI;if(t==='ans')return calcAns;
    if(F[t]){return F[t](un())}
    const n=Number(t);if(!isFinite(n)||t===undefined)throw Error('x');return n;
  };
  if(!tk.length)return 0;  const v=expr();if(p!==tk.length||!isFinite(v))throw Error('x');return v;
}
function openCalc(){
  floatWin('calcwin','Calculator',`<div class="calc"><input class="cdisp" id="cd" autocomplete="off" spellcheck="false" placeholder="0"><div class="cres" id="cr"></div><div class="ckeys">${
   [['sin','op'],['cos','op'],['tan','op'],['ln','op'],['log','op'],['π','op'],['√','op'],['^','op'],['(','op'],[')','op'],
    ['7'],['8'],['9'],['÷','op'],['⌫','op'],['4'],['5'],['6'],['×','op'],['C','op'],['1'],['2'],['3'],['−','op'],['ans','op'],['0'],['.'],['DEG','op'],['+','op'],['=','eq']]
   .map(([k,c])=>`<button class="${c||''}" data-a="ck" data-v="${k}">${k==='DEG'?(deg?'DEG':'RAD'):k}</button>`).join('')}</div></div>`,'');
  const cd=$('#cd');if(cd){cd.focus();cd.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ckey('=')}})}
}
function ckey(k){
  const cd=$('#cd'),cr=$('#cr');if(!cd)return;
  if(k==='C'){cd.value='';cr.textContent=''}
  else if(k==='⌫')cd.value=cd.value.slice(0,-1);
  else if(k==='DEG'){deg=!deg;document.querySelectorAll('#calcwin [data-v="DEG"]').forEach(b=>b.textContent=deg?'DEG':'RAD')}
  else if(k==='='){try{const v=calcEval(cd.value);calcAns=v;cr.textContent='= '+String(Number(v.toPrecision(12)));cd.select()}catch(e){cr.textContent='Error'}}
  else{cd.value+=['sin','cos','tan','ln','log'].includes(k)?k+'(':k==='√'?'√(':k;cd.focus()}
}

function openNotes(){
  const id=T.plan[T.mod][T.idx];
  const w=floatWin('noteswin','Notes',`<textarea id="nt" placeholder="Notes for this question"></textarea><p class="hint">Drag across the passage to highlight it. Click a highlight to remove it.</p>`,'notes');

/* ═════════════ actions ═════════════ */
function go(i){const l=T.plan[T.mod];if(i<0||i>=l.length)return;T.idx=i;T.phase='exam';save();closePops();draw()}
function setPick(L){
  const id=T.plan[T.mod][T.idx];
  T.ans[id]=T.ans[id]===L?'':L;
  document.querySelectorAll('#choices .choice').forEach(c=>c.classList.toggle('sel',c.dataset.v===T.ans[id]));
  save();
}
const A={
  start(){if(store.get('sat.cur.v1')&&!confirm('Starting a new test will discard the one in progress. Continue?'))return;T=null;newTest()},
  again(){T=null;newTest()},
  resumetest(){T=store.get('sat.cur.v1');if(!T)return;resumeClock();draw()},
  home(){T=null;draw()},
  open(b){const t=H.tests.find(x=>x.id===b.dataset.id);if(!t)return;T=JSON.parse(JSON.stringify(t));T.phase='results';T.sum=t.sum;draw()},
  reset(){if(confirm('Delete all saved test history? Every question will count as unseen again.')){H={tests:[],seen:{},n:0};saveH();clearCur();draw()}},
  pick(b){if(b.classList.contains('static'))return;setPick(b.dataset.v)},
  x(b){
    const id=T.plan[T.mod][T.idx];T.el[id]=T.el[id]||{};
    T.el[id][b.dataset.v]=!T.el[id][b.dataset.v];
    b.closest('.choice').classList.toggle('out',T.el[id][b.dataset.v]);save();
  },
  elim(b){UI.elim=!UI.elim;b.classList.toggle('on',UI.elim);const c=$('#choices');if(c)c.classList.toggle('elim',UI.elim)},
  mark(b){const id=T.plan[T.mod][T.idx];T.mark[id]=!T.mark[id];b.classList.toggle('on',T.mark[id]);save()},
  next(){const l=T.plan[T.mod];if(T.idx<l.length-1)go(T.idx+1);else{T.phase='review';save();closePops();draw()}},
  back(){if(T.phase==='review'){go(T.plan[T.mod].length-1)}else go(T.idx-1)},
  go(b){go(+b.dataset.i)},
  nav(){toggleNav()},
  toreview(){T.phase='review';save();closePops();draw()},
  closepop(){closePops()},
  closefloat(b){const e=document.getElementById(b.dataset.id);if(e)e.remove()},
  dir(){toggleDir()},
  more(){toggleMore()},
  layout(b){UI.layout=b.dataset.v;UI.split=null;store.set('sat.layout',UI.layout);closePops();layout()},
  exit(){closePops();modal('Save and exit?','Your progress is saved. You can resume this test from the home screen.','<button class="btn ghost" data-a="mclose">Cancel</button><button class="btn" data-a="exitnow">Save &amp; exit</button>')},
  exitnow(){closeModal();save();clearInterval(tickH);T=null;closeAll();draw()},
  mclose(){closeModal()},
  hidetime(){UI.timer=!UI.timer;drawTimer()},
  hlmode(b){UI.hlMode=!UI.hlMode;b.classList.toggle('on',UI.hlMode);const s=$('#stem');if(s)s.classList.toggle('hl-on',UI.hlMode);if(UI.hlMode)openNotes();else{const n=document.getElementById('noteswin');if(n)n.remove()}},
  calc(){openCalc()},ref(){openRef()},ck(b){ckey(b.dataset.v)},
  submit(){
    const l=T.plan[T.mod],un=l.filter(id=>!has(T.ans[id])).length;
    modal('Submit this module?',(un?`You have ${un} unanswered question${un>1?'s':''}. `:'')+'You will not be able to return to it.','<button class="btn ghost" data-a="mclose">Cancel</button><button class="btn" data-a="submitnow">Submit</button>');
  },
  submitnow(){closeModal();submitModule(false)},
  cont(){loadModule(T.next)},
  resume(){loadModule('m1')},
  qrev(b){UI.view={k:b.dataset.k,i:+b.dataset.i};draw();scrollTo(0,0)},
  qrback(){UI.view=null;draw()},
  qrprev(){const L=qReviewList(),p=L.findIndex(x=>x.k===UI.view.k&&x.i===UI.view.i);if(p>0){UI.view={k:L[p-1].k,i:L[p-1].i};draw();$('.center').scrollTo(0,0)}},
  qrnext(){const L=qReviewList(),p=L.findIndex(x=>x.k===UI.view.k&&x.i===UI.view.i);if(p<L.length-1){UI.view={k:L[p+1].k,i:L[p+1].i};draw();$('.center').scrollTo(0,0)}}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b){e.preventDefault();const f=A[b.dataset.a];if(f)f(b);return}
  // click outside popovers closes them
  if(!e.target.closest('.pop')&&!e.target.closest('.modal'))closePops();
});
addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePops();closeModal()}});
